<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RLCoach Pro - Conocimiento Total</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* (Estilos preservados de la versión anterior para mantener la estética) */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080b12;color:#fff;font-family:'Exo 2',sans-serif;min-height:100vh;}
.arena-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse 120% 60% at 50% 100%,#001830 0%,#080b12 60%);}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:rgba(8,11,18,0.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,170,255,0.1);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#fff 30%,#0af 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(8,11,18,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(0,170,255,0.1);padding-bottom:env(safe-area-inset-bottom,0px);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border:none;background:transparent;cursor:pointer;min-height:56px;}
.bnav-label{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.28);}
.bnav-btn.active .bnav-label{color:#0af;}
.main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 80px;}
.btn-boost{border:none;border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:15px 44px;background:linear-gradient(135deg,#ff5500,#ff2200);color:#fff;box-shadow:0 0 35px rgba(255,85,0,0.4);}
.card{background:rgba(13,20,32,0.8);border:1px solid rgba(0,170,255,0.1);border-radius:12px;padding:18px;}
.msg-input{background:rgba(255,255,255,0.04);border:1px solid rgba(0,170,255,0.14);border-radius:6px;color:#fff;padding:11px 14px;resize:none;outline:none;width:100%;}
.btn-send{background:linear-gradient(135deg,#ff5500,#cc2200);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:800;padding:12px 16px;cursor:pointer;}
.api-banner{background:rgba(255,85,0,0.08);border-bottom:1px solid rgba(255,85,0,0.18);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:99;}
.api-input{background:rgba(0,0,0,0.3);border:1px solid rgba(255,85,0,0.28);border-radius:6px;color:#fff;padding:7px 12px;outline:none;width:260px;}
.dot{display:inline-block;width:6px;height:6px;background:#0af;border-radius:50%;margin:0 2px;animation:bounce 1.2s infinite;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.routine-header{background:linear-gradient(135deg,rgba(13,20,32,0.9),rgba(0,30,60,0.4));border:1px solid rgba(0,170,255,0.14);border-radius:12px;padding:18px;margin-bottom:10px;}
.day-card{background:rgba(13,20,32,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px;padding:15px;}
.exercise{background:rgba(0,0,0,0.2);border-radius:8px;padding:10px 12px;border:1px solid rgba(255,255,255,0.04);margin-top:10px;}
.tag{display:inline-block;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;padding:2px 7px;font-weight:700;text-transform:uppercase;border:1px solid;}
.tag-f{background:rgba(76,175,80,0.15);color:#81c784;border-color:rgba(76,175,80,0.3);}
.tag-m{background:rgba(255,193,7,0.15);color:#ffd54f;border-color:rgba(255,193,7,0.3);}
.tag-d{background:rgba(239,83,80,0.15);color:#ef9a9a;border-color:rgba(239,83,80,0.3);}
.code-badge{background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.22);border-radius:3px;color:#0af;font-size:0.62rem;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;}
</style>
</head>
<body>
<div class="arena-bg"></div>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef} = React;

// CONOCIMIENTO INTEGRADO (TUS TEXTOS)
const KNOWLEDGE = `
FUNDAMENTOS: Física sin RNG, momentum, spin, peso y ángulos de impacto. 
HITBOXES: Octane (equilibrada), Dominus (flicks/redirects), Breakout, Plank, Hybrid.
BOOST MGMT: Pads pequeños (12) > Pads grandes (100). Mantener presión sin abandonar jugada.
MECÁNICAS CORE:
- Movilidad: Powerslide (momentum), Half-flip (180 rápidos), Wave dash (zap/wall dash), Speed flip (diagonal flip cancel).
- Disparo: Power shots (golpe post-bote), Bounce shots, Hook shots, Air roll shots, Double taps (backboard), Pinches (Kuxir/Wall).
- Dribbling: Ground (flicks 45/90, Musty, Breezi), Bounce dribble (control de botes).
- Aéreo: Fast Aerial (doble salto+boost), Air Roll L/R, Air Dribbles, Ceiling Shots, Flip Resets.
DEFENSA Y TÁCTICA:
- Shadow Defense (retroceso/distancia), Backboard Defense, Prejumps (predicción).
- Rotaciones: 1st (presión), 2nd (apoyo), 3rd (seguridad). Evitar Double Commits.
- Juego Físico: Demos y Bumps como herramienta táctica.
PSICOLOGÍA: Evitar el Tilt, consistencia mental.
MAPAS DE ENTRENAMIENTO:
- Tiro: 6EB1-79B2-33B8-681C, 7028-5E10-88EF-E83E.
- Aéreos: F6D6-E749-4FDD-23C7, CAFC-FB3E-3C0F-B8F1.
- Dribbles: 7067-44F0-A1C8-7DAC, 3E84-2FCA-61B9-FE21.
- Defensa: 5CCE-FB29-7B05-A0B1, 99E5-4AA3-60D5-44BD.
- Kickoffs/Recoveries: A503-264C-A7EB-D282, 1E5E-5D7F-5D82-6C5B.
`;

const SYSTEM_COACH = `Eres RLCoach Pro. Basado en este conocimiento: ${KNOWLEDGE}
Tu objetivo es diagnosticar al jugador y crear una rutina.
PASOS DIAGNÓSTICO:
1. Pregunta por Rango y horas.
2. Pregunta por control terrestre (Half-flips, Speed flips).
3. Pregunta por gestión de boost y pads pequeños.
4. Pregunta por Aerials (Fast aerials, resets).
5. Pregunta por rotaciones y shadow defense.

Una vez tengas todo, genera un JSON exacto:
{"tipo":"rutina","nombre":"Nombre","rango":"Rango","diagnostico":"Breve análisis","meta":"Objetivo","dias":[{"dia":"Lunes","enfoque":"X","ejercicios":[{"nombre":"X","codigo":"CODIGO","duracion":"10m","dificultad":"facil/media/dificil","descripcion":"X"}]}]}
`;

let API_KEY = localStorage.getItem("rlcoach_groq_key") || "";

async function callGroq({system, messages, model="llama-3.3-70b-versatile", json=false}){
  if(!API_KEY) throw new Error("NO_KEY");
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}`},
    body: JSON.stringify({
      model, messages: [{role: "system", content: system}, ...messages],
      temperature: 0.6,
      response_format: json ? {type: "json_object"} : {type: "text"}
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

// Componentes de la App
function App(){
  const [tab, setTab] = useState("diagnostico");
  const [routine, setRoutine] = useState(JSON.parse(localStorage.getItem("rl_routine")));
  const [key, setKey] = useState(API_KEY);

  const saveKey = () => { API_KEY = key; localStorage.setItem("rlcoach_groq_key", key); alert("Key guardada"); };

  return (
    <div>
      <div className="api-banner">
        <input className="api-input" type="password" placeholder="Groq API Key (gsk_...)" value={key} onChange={e=>setKey(e.target.value)}/>
        <button className="btn-send" style={{padding:"5px 12px"}} onClick={saveKey}>OK</button>
      </div>
      <nav className="nav"><div className="logo">RL COACH <span style={{color:"#ff5500"}}>PRO</span></div></nav>
      <div className="main">
        {tab === "diagnostico" && <DiagnosticoSection onSaved={(r)=>{setRoutine(r); localStorage.setItem("rl_routine", JSON.stringify(r)); setTab("rutina");}}/>}
        {tab === "rutina" && (routine ? <RoutineView routine={routine} onReset={()=>{setRoutine(null); localStorage.removeItem("rl_routine");}}/> : <p style={{textAlign:"center", marginTop:40}}>No hay rutina. Completa el diagnóstico.</p>)}
        {tab === "chat" && <ChatSection/>}
        {tab === "analizar" && <AnalizarSection/>}
      </div>
      <div className="bnav">
        <button className={`bnav-btn ${tab==="diagnostico"?"active":""}`} onClick={()=>setTab("diagnostico")}>🔍<span className="bnav-label">Test</span></button>
        <button className={`bnav-btn ${tab==="rutina"?"active":""}`} onClick={()=>setTab("rutina")}>📅<span className="bnav-label">Plan</span></button>
        <button className={`bnav-btn ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")}>💬<span className="bnav-label">Chat</span></button>
        <button className={`bnav-btn ${tab==="analizar"?"active":""}`} onClick={()=>setTab("analizar")}>📸<span className="bnav-label">Analizar</span></button>
      </div>
    </div>
  );
}

// (Omito detalles repetidos de componentes visuales para centrarme en la lógica, 
// pero en el archivo final estarían todos integrados como en el paso anterior)

function DiagnosticoSection({onSaved}){
  const [messages, setMessages] = useState([{role:"assistant", content:"¡Hola! Soy tu RLCoach Pro. Para diseñarte el plan perfecto, ¿cuál es tu rango actual y cuántas horas llevas aproximadamente?"}]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);

  const send = async () => {
    if(!input.trim() || loading) return;
    const nm = [...messages, {role:"user", content:input}];
    setMessages(nm); setInput(""); setLoading(true);
    try {
      const r = await callGroq({system: SYSTEM_COACH, messages: nm, json: messages.length > 6});
      try {
        const json = JSON.parse(r);
        if(json.tipo === "rutina") { onSaved(json); return; }
      } catch(e) {}
      setMessages([...nm, {role:"assistant", content:r}]);
    } catch(e) { alert(e.message === "NO_KEY" ? "Pon tu Groq API Key arriba" : e.message); }
    setLoading(false);
  };

  return (
    <div style={{display:"flex", flexDirection:"column", height:"70vh"}}>
      <div style={{flex:1, overflowY:"auto", paddingBottom:20}}>
        {messages.map((m,i) => <div key={i} className="card" style={{marginBottom:10, borderLeft: m.role==="user"?"4px solid #ff5500":"4px solid #0af"}}>{m.content}</div>)}
        {loading && <div className="dot"/>}
      </div>
      <div style={{display:"flex", gap:10}}>
        <textarea className="msg-input" value={input} onChange={e=>setInput(e.target.value)} placeholder="Escribe aquí..."/>
        <button className="btn-send" onClick={send}>ENVIAR</button>
      </div>
    </div>
  );
}

function RoutineView({routine, onReset}){
  return (
    <div className="fade-in">
      <div className="routine-header">
        <h2>{routine.nombre}</h2>
        <p style={{color:"#0af"}}>{routine.rango} | {routine.meta}</p>
        <button className="btn-send" style={{marginTop:10, background:"#333"}} onClick={onReset}>NUEVO TEST</button>
      </div>
      {routine.dias.map((d,i)=>(
        <div key={i} className="day-card">
          <h3 style={{color:"#ff5500"}}>{d.dia} - {d.enfoque}</h3>
          {d.ejercicios.map((ej,j)=>(
            <div key={j} className="exercise">
              <div style={{display:"flex", justifyContent:"space-between"}}>
                <strong>{ej.nombre}</strong>
                <span className={`tag ${ej.dificultad==="facil"?"tag-f":ej.dificultad==="media"?"tag-m":"tag-d"}`}>{ej.dificultad}</span>
              </div>
              <p style={{fontSize:"0.8rem", margin:"5px 0", opacity:0.8}}>{ej.descripcion}</p>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <span className="code-badge">{ej.codigo}</span>
                <span style={{fontSize:"0.7rem", fontWeight:800}}>{ej.duracion}</span>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function ChatSection(){
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const send = async () => {
    const nm = [...messages, {role:"user", content:input}];
    setMessages(nm); setInput(""); setLoading(true);
    const r = await callGroq({system: "Eres el RLCoach experto basado en la guía integral. Responde de forma técnica pero motivadora.", messages: nm});
    setMessages([...nm, {role:"assistant", content:r}]);
    setLoading(false);
  };
  return (
    <div style={{display:"flex", flexDirection:"column", height:"70vh"}}>
      <div style={{flex:1, overflowY:"auto"}}>
        {messages.map((m,i)=><div key={i} className="card" style={{marginBottom:10}}>{m.content}</div>)}
      </div>
      <div style={{display:"flex", gap:10}}>
        <textarea className="msg-input" value={input} onChange={e=>setInput(e.target.value)}/>
        <button className="btn-send" onClick={send}>CHAT</button>
      </div>
    </div>
  );
}

function AnalizarSection(){
  const [img, setImg] = useState(null);
  const [res, setRes] = useState("");
  const [loading, setLoading] = useState(false);
  const analyze = async (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      setImg(reader.result);
      setLoading(true);
      try {
        const r = await callGroq({
          system: "Analiza la imagen de Rocket League y da consejos basados en la guía.",
          messages: [{role:"user", content:[{type:"text", text:"Analiza esta captura"}, {type:"image_url", image_url:{url:reader.result}}]}],
          model: "llama-3.2-11b-vision-preview"
        });
        setRes(r);
      } catch(e){ setRes("Error de visión."); }
      setLoading(false);
    };
    reader.readAsDataURL(file);
  };
  return (
    <div style={{textAlign:"center"}}>
      <input type="file" onChange={analyze} style={{marginBottom:20}}/>
      {img && <img src={img} style={{width:"100%", borderRadius:12}}/>}
      {loading && <div className="dot"/>}
      {res && <div className="card" style={{marginTop:20}}>{res}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
