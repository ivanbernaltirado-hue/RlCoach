<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RLCoach - Entrenador de Rocket League</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080b12;color:#fff;font-family:'Exo 2',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#080b12;}
::-webkit-scrollbar-thumb{background:#0af3;border-radius:2px;}

/* BACKGROUND */
.arena-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse 120% 60% at 50% 100%,#001830 0%,#080b12 60%);}
.arena-floor{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,rgba(0,100,200,0.07) 0%,transparent 100%);border-top:1px solid rgba(0,170,255,0.08);}
.arena-line{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:2px;height:35%;background:linear-gradient(to top,rgba(0,170,255,0.35),transparent);}
.arena-circle{position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleY(0.3);width:400px;height:400px;border-radius:50%;border:1px solid rgba(0,170,255,0.12);}
.particle{position:absolute;border-radius:50%;animation:pfloat linear infinite;pointer-events:none;}
@keyframes pfloat{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:0.7;}90%{opacity:0.7;}100%{transform:translateY(-20px) scale(1);opacity:0;}}
.speed-line{position:absolute;height:1px;background:linear-gradient(to right,transparent,rgba(0,170,255,0.25),transparent);animation:sline linear infinite;}
@keyframes sline{0%{transform:translateX(-100%);opacity:0;}50%{opacity:1;}100%{transform:translateX(200%);opacity:0;}}

/* NAV */
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:rgba(8,11,18,0.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,170,255,0.1);}
.nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,170,255,0.5),rgba(255,85,0,0.4),transparent);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#fff 30%,#0af 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-dot{-webkit-text-fill-color:#ff5500;}
.nav-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:2px;color:rgba(255,255,255,0.22);text-transform:uppercase;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(8,11,18,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(0,170,255,0.1);padding-bottom:env(safe-area-inset-bottom,0px);}
.bnav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,170,255,0.5),rgba(255,85,0,0.4),transparent);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border:none;background:transparent;cursor:pointer;transition:all 0.2s;position:relative;min-height:56px;}
.bnav-icon{font-size:1.15rem;transition:transform 0.2s;}
.bnav-label{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.28);transition:color 0.2s;white-space:nowrap;}
.bnav-btn.active .bnav-label{color:#0af;}
.bnav-btn.active .bnav-icon{transform:translateY(-2px);}
.bnav-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,#0af,transparent);border-radius:0 0 2px 2px;}

/* MAIN */
.main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 80px;}

/* BUTTONS */
.btn-boost{position:relative;border:none;border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:15px 44px;background:linear-gradient(135deg,#ff5500,#ff2200);color:#fff;transition:all 0.2s;box-shadow:0 0 35px rgba(255,85,0,0.4),0 4px 15px rgba(0,0,0,0.4);}
.btn-boost:hover{transform:translateY(-2px);box-shadow:0 0 55px rgba(255,85,0,0.6),0 8px 20px rgba(0,0,0,0.4);}
.btn-boost:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-blue{background:linear-gradient(135deg,#0af,#0055cc);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:0.82rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 28px;cursor:pointer;transition:all 0.2s;box-shadow:0 0 25px rgba(0,170,255,0.3);}
.btn-blue:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(0,170,255,0.5);}
.btn-blue:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-red{background:linear-gradient(135deg,#ef5350,#b71c1c);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:10px 18px;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.13);border-radius:6px;color:rgba(255,255,255,0.45);font-family:'Exo 2',sans-serif;font-size:0.78rem;padding:8px 14px;cursor:pointer;transition:all 0.2s;}
.btn-ghost:hover{border-color:rgba(255,85,0,0.4);color:rgba(255,85,0,0.8);}
.btn-send{background:linear-gradient(135deg,#ff5500,#cc2200);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:12px 16px;cursor:pointer;transition:all 0.2s;box-shadow:0 0 18px rgba(255,85,0,0.3);white-space:nowrap;}
.btn-send:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(255,85,0,0.5);}
.btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* CARDS */
.card{background:rgba(13,20,32,0.8);border:1px solid rgba(0,170,255,0.1);border-radius:12px;padding:18px;}
.card-orange{background:rgba(255,85,0,0.06);border:1px solid rgba(255,85,0,0.16);border-radius:12px;padding:16px;}

/* INPUT */
.msg-input{background:rgba(255,255,255,0.04);border:1px solid rgba(0,170,255,0.14);border-radius:6px;color:#fff;font-family:'Exo 2',sans-serif;font-size:0.92rem;padding:11px 14px;resize:none;outline:none;transition:border-color 0.2s;width:100%;}
.msg-input:focus{border-color:rgba(0,170,255,0.4);}
.msg-input::placeholder{color:rgba(255,255,255,0.2);}

/* PROGRESS */
.pbar-bg{height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:2px;transition:width 0.5s ease;}

/* DOTS */
.dot{display:inline-block;width:6px;height:6px;background:#0af;border-radius:50%;margin:0 2px;animation:bounce 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.fade-in{animation:fi 0.3s ease forwards;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* TAGS */
.tag{display:inline-block;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:1px;padding:2px 7px;font-weight:700;text-transform:uppercase;}
.tag-f{background:rgba(76,175,80,0.15);color:#81c784;border:1px solid rgba(76,175,80,0.3);}
.tag-m{background:rgba(255,193,7,0.15);color:#ffd54f;border:1px solid rgba(255,193,7,0.3);}
.tag-d{background:rgba(239,83,80,0.15);color:#ef9a9a;border:1px solid rgba(239,83,80,0.3);}
.code-badge{background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.22);border-radius:3px;color:#0af;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:1px;padding:2px 8px;font-weight:700;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#0a1320;border:1px solid rgba(239,83,80,0.28);border-radius:16px;padding:28px;max-width:400px;width:100%;text-align:center;}

/* FILE DROP */
.file-drop{border:2px dashed rgba(0,170,255,0.22);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:all 0.2s;display:block;width:100%;}
.file-drop:hover{border-color:rgba(0,170,255,0.5);background:rgba(0,170,255,0.03);}

/* SUGGESTIONS */
.sug-btn{background:rgba(0,170,255,0.05);border:1px solid rgba(0,170,255,0.13);border-radius:20px;color:rgba(255,255,255,0.42);font-family:'Exo 2',sans-serif;font-size:0.78rem;padding:6px 13px;cursor:pointer;transition:all 0.2s;}
.sug-btn:hover{border-color:rgba(0,170,255,0.35);color:rgba(255,255,255,0.72);}

/* API BANNER */
.api-banner{background:rgba(255,85,0,0.08);border-bottom:1px solid rgba(255,85,0,0.18);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;z-index:99;}
.api-input{background:rgba(0,0,0,0.3);border:1px solid rgba(255,85,0,0.28);border-radius:6px;color:#fff;font-family:'Exo 2',sans-serif;font-size:0.85rem;padding:7px 12px;outline:none;width:260px;max-width:100%;}

/* SECTION LABEL */
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:10px;}

/* HERO */
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,85,0,0.1);border:1px solid rgba(255,85,0,0.28);border-radius:20px;padding:4px 14px;font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:2px;color:#ff5500;text-transform:uppercase;}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:0.95;}
.rank-badge{padding:4px 11px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;}

/* STEPS */
.step-card{background:rgba(13,20,32,0.8);border-radius:10px;padding:16px 10px;text-align:center;border:1px solid rgba(0,170,255,0.1);position:relative;overflow:hidden;transition:all 0.2s;}
.step-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c,#0af),transparent);}
.step-card:hover{border-color:rgba(0,170,255,0.22);transform:translateY(-2px);}

/* ROUTINE */
.routine-header{background:linear-gradient(135deg,rgba(13,20,32,0.9),rgba(0,30,60,0.4));border:1px solid rgba(0,170,255,0.14);border-radius:12px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden;}
.routine-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#0af,#0055ff,transparent);}
.day-card{background:rgba(13,20,32,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.day-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.exercise{background:rgba(0,0,0,0.2);border-radius:8px;padding:10px 12px;border:1px solid rgba(255,255,255,0.04);}

/* CHAT */
.chat-header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid rgba(0,170,255,0.08);background:rgba(13,20,32,0.6);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0af,#0044cc);display:flex;align-items:center;justify-content:center;font-size:0.9rem;box-shadow:0 0 12px rgba(0,170,255,0.35);flex-shrink:0;}

@media(max-width:400px){.bnav-label{font-size:0.55rem;}.logo{font-size:1.1rem;}}
</style>
</head>
<body>
<div class="arena-bg">
  <div class="arena-floor"></div>
  <div class="arena-line"></div>
  <div class="arena-circle"></div>
</div>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

const RANKS = ["Bronce","Plata","Oro","Platino","Diamante","Campeón","Gran Campeón","Leyenda Supersónica"];
const RANK_COLORS = {"Bronce":"#cd7f32","Plata":"#c0c0c0","Oro":"#ffd700","Platino":"#00d4ff","Diamante":"#4fc3f7","Campeón":"#ab47bc","Gran Campeón":"#ef5350","Leyenda Supersónica":"#ff5500"};

const KNOWLEDGE = `CONOCIMIENTO COMPLETO DE ROCKET LEAGUE:

FÍSICA DEL JUEGO: No existe RNG. Todo depende de ángulo, velocidad y punto de impacto. La fuerza del disparo depende de la velocidad relativa entre coche y pelota. La pelota conserva momentum, spin y dirección según el impacto. Las paredes y esquinas mantienen continuidad de jugadas.

HITBOXES: Octane (equilibrio, la más usada), Dominus (larga y plana, ideal para flicks y redirects), Breakout, Plank, Hybrid. El hitbox importa más que el aspecto visual del coche.

BOOST: Recurso más importante. Pads pequeños=12 unidades, Grandes=100. Jugadores avanzados usan cadenas de pads pequeños para no abandonar jugadas. Nunca depender solo de boosts grandes.

MOVILIDAD TERRESTRE:
- Powerslide/drift: girar sin perder velocidad. Clave para recoveries, cambios de dirección y ajustes defensivos
- Wave dash: ganar velocidad aterrizando mientras haces dodge justo antes de tocar el suelo
- Half flip: girarte 180 grados rapidísimo cancelando un backflip. Esencial en defensa
- Speed flip: técnica más rápida del juego, usada en kickoffs. Diagonal flip + cancel perfecto + boost continuo

FÍSICA DE LA PELOTA: No es igual tocar el centro que la parte inferior o lateral. Power shots aprovechan rebotes para máxima potencia. Bounce dribbles usan la inestabilidad del bote para tiros difíciles de leer.

TIROS: basic shots (dodge frontal), power shots (rebote+potencia), bounce shots (tras bote), hook shots (desde lateral), air roll shots, double taps (backboard+remate aéreo), redirects (cambiar dirección de pase), pinches kuxir/ground/wall (dos superficies aplastan la pelota).

DRIBBLING: Ground dribble (pelota encima del coche, para flicks/baits/outplays/ritmo). Bounce dribble (SSL usan constantemente para disparar fuerte y cambiar ritmo).

FLICKS: front flick (básico), 45° flick (mucha potencia, difícil de parar), 90° flick, musty flick (inclinarse+backflip+golpe con parte trasera, inventado por Musty), breezi flick (estiloso), mognus flick (rápido y eficiente).

AERIALS: Fast aerial obligatorio en rangos altos (salto+boost+segundo salto muy rápido). Air roll left/right para mejor control. Directional aerial control.

AIR DRIBBLES: Mantener pelota pegada mientras vuelas. Primer toque suave, mantener distancia, igualar velocidad. Air dribble bump (golpear rival durante air dribble). Ceiling air dribble (desde techo sin gastar segundo salto).

CEILING SHOTS: Subir al techo, caer con flip guardado, disparar cuando quieras. Muy difíciles de leer.

FLIP RESETS: Recuperar flip tocando 4 ruedas sobre la pelota. Single/double/triple/psycho reset. Permite cambiar dirección o disparar en cualquier momento inesperado.

RECOVERIES AVANZADAS: Landing recovery (caer con ruedas correctamente), Zap dash (aceleración rápida avanzada), Wall dash (wave dashes repetidos en pared).

KICKOFFS: Standard, speedflip (más rápido), fake (finges ir al balón), delayed (llegas ligeramente tarde para ganar control).

DEFENSA: Shadow defense (retroceder frente al rival manteniendo distancia de reacción). Backboard defense (esencial para jugadas aéreas que rebotan en pared trasera). Goal line defense. Prejump (salto anticipado basado en predicción pura, necesario porque en rangos altos reaccionar tarde=gol).

ROTACIONES: Causa de más derrotas que la mala mecánica. First man (presiona), Second man (apoya buscando continuación), Third man (seguridad defensiva). Evitar dobles commits. Presión constante, controlar boosts enemigos.

DEMOS Y BUMPS: Demo=destruir coche rival (desaparece unos segundos). Competitivamente esencial. Quitar defensor=gol fácil. Bump=golpe suave sin destruir. Los pros usan mucho el juego físico para generar espacio.

MODOS: 1v1 (más mecánico y mental, cualquier error=gol), 2v2 (más popular, combina mecánica y rotaciones), 3v3 (estándar competitivo profesional). Extra: Hoops (baloncesto), Snow Day (hockey puck), Dropshot (romper suelo), Rumble (power-ups).

RANGOS: Bronce→Plata→Oro→Platino→Diamante→Campeón→Gran Campeón→Leyenda Supersónica. Mayoría de jugadores en Oro/Platino/Diamante. Desde Campeón la velocidad aumenta mucho y la consistencia es clave. En Gran Campeón y SSL todos dominan recoveries, speed flips, control aéreo y toma de decisiones avanzada.

PSICOLOGÍA: El tilt (perder confianza tras errores) es muy común. Los mejores mantienen calma porque saben que el juego cambia rápido. La consistencia mental importa casi tanto como la mecánica.

MECÁNICAS AVANZADAS: psycho (marcar usando techo de portería rival), sting pop (levantar pelota con el morro), lix jump, reset musty (flip reset+musty flick), hel jump, zap dash, wall dash.

MAPAS Y PACKS (códigos exactos):
TIRO: Consistencia tiro:6EB1-79B2-33B8-681C | Power shots:7028-5E10-88EF-E83E | Shooting consistency:4912-A5C9-9A56-555D
AERIALS: Basic aerials:F6D6-E749-4FDD-23C7 | Redirects:8D93-C997-0ACD-8416 | Double taps:CAFC-FB3E-3C0F-B8F1
DRIBBLES: Ground dribbles:7067-44F0-A1C8-7DAC | Flick practice:3E84-2FCA-61B9-FE21 | Bounce dribbles:E1B1-1F65-8F9D-DA4B
AIR DRIBBLES: Air dribble:9D87-258C-3C05-6FA9 | Ceiling shots:5DFF-0C9B-75E7-47D7 | Flip resets:A6D8-BC6C-DBB0-7F5A
DEFENSA: Shadow defense:5CCE-FB29-7B05-A0B1 | Backboard defense:99E5-4AA3-60D5-44BD | Saves difíciles:2E23-ABD5-20C6-DBD4
RECOVERIES: Speed flip trainer:A503-264C-A7EB-D282 | Half flip practice:0E99-5226-7A42-569C | Recovery training:1E5E-5D7F-5D82-6C5B
AVANZADOS: Lethamyr Giant Rings | Dribble 2 Overhaul | Neon Heights Rings | Speed Jump Trials 1-4 | Impossible Rings 2

ORDEN RECOMENDADO PARA MEJORAR: 1.Recoveries 2.Tiro 3.Fast aerials 4.Rotaciones 5.Dribbling 6.Flicks 7.Air dribbles 8.Flip resets 9.Mecánicas avanzadas`;

const SYSTEM_COACH = `Eres RLCoach, entrenador experto de Rocket League. ${KNOWLEDGE}

PREGUNTAS DEL DIAGNÓSTICO (una por una en orden):
1. ¿Cómo describes tu control del coche? ¿Tienes problemas con el powerslide, el half-flip, el wave dash o el air roll?
2. ¿Qué falla más en tus partidas: los tiros o las rotaciones?
3. ¿Cómo gestionas el boost? ¿Te quedas sin boost o recoges bien los pads pequeños?
4. ¿Qué mecánica aérea dominas mejor y cuál te cuesta más: fast aerials, air dribbles o los tiros en general?
5. ¿Cuántos días a la semana juegas y cuánto tiempo por sesión aproximadamente?
6. ¿Cuál es tu rango actual? (Bronce, Plata, Oro, Platino, Diamante, Campeón, Gran Campeón, Leyenda Supersónica)

Cuando tengas TODAS las respuestas, responde ÚNICAMENTE con este JSON sin texto ni markdown:
{"tipo":"rutina","nombre":"Nombre motivador","rango":"rango","diagnostico":"resumen 2-3 lineas","meta":"meta 2-4 semanas","dias":[{"dia":"Lunes","tiempo":"45 min","enfoque":"Recoveries + Tiro","ejercicios":[{"nombre":"Recovery training","codigo":"1E5E-5D7F-5D82-6C5B","duracion":"15 min","dificultad":"facil","descripcion":"Aterrizajes controlados"}],"areas":[{"area":"Recoveries","porcentaje":40},{"area":"Tiro","porcentaje":45},{"area":"Libre","porcentaje":15}]}],"consejos":["c1","c2","c3"]}

REGLAS CLAVE:
- Habla siempre en español
- Bronce/Plata/Oro: recoveries + tiro básico + rotaciones. NO recomiendes flip resets ni ceiling shots
- Platino/Diamante: fast aerials + dribbling + flicks + boost management
- Campeón+: air dribbles + flip resets + lectura de juego + psicología
- Adapta los consejos al modo de juego preferido (1v1, 2v2, 3v3)
- Empieza con bienvenida breve y la primera pregunta`;

const SYSTEM_CHAT = `Eres RLCoach, entrenador experto y amigable de Rocket League. ${KNOWLEDGE}

Respondes en español, de forma clara, directa y útil. Cuando alguien pregunta sobre mecánicas, explica tanto cómo ejecutarlas como cuándo usarlas en partida. Adapta la complejidad de tu respuesta al nivel del jugador si lo sabes. Sé práctico y específico.`;

const SYSTEM_MECANICA = `Eres experto en mecánicas de Rocket League. ${KNOWLEDGE}

Cuando veas una imagen o vídeo:
1. Identifica exactamente qué mecánica aparece
2. Explica cómo se ejecuta paso a paso
3. Da consejos específicos para mejorarla
4. Recomienda mapas o packs de entrenamiento con códigos exactos si los hay
Responde en español de forma clara y estructurada.`;

let API_KEY = localStorage.getItem("rlcoach_key")||"";

async function callClaude({system,messages,maxTokens=1500}){
  if(!API_KEY) throw new Error("NO_KEY");
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-5-20250929",max_tokens:maxTokens,system,messages:messages.map(({role,content})=>({role,content}))}),
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content.map(b=>b.text||"").join("");
}

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  const start=async()=>{
    setPhase("chat");setLoading(true);
    try{
      const reply=await callClaude({system:SYSTEM_COACH,messages:[{role:"user",content:"Empezar"}],maxTokens:500});
      setMessages([{role:"user",content:"Empezar"},{role:"assistant",content:reply}]);
      setQNum(1);
    }catch(e){
      const msg=e.message==="NO_KEY"?"Introduce tu API key arriba para continuar.":"Error al conectar.";
      setMessages([{role:"user",content:"Empezar"},{role:"assistant",content:msg}]);
    }
    setLoading(false);
  };

  const send=async()=>{
    if(!input.trim()||loading) return;
    const um={role:"user",content:input.trim()};
    const nm=[...messages,um];
    setMessages(nm);setInput("");setLoading(true);
    setQNum(q=>Math.min(q+1,6));

function AnalizarSection(){
  const [media,setMedia]=useState(null);
  const [mediaType,setMediaType]=useState(null);
  const [b64,setB64]=useState(null);
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);

  const handleFile=f=>{
    if(!f) return;
    const isImg=f.type.startsWith("image/");
    const isVid=f.type.startsWith("video/");
    if(!isImg&&!isVid){alert("Solo se admiten imágenes y vídeos.");return;}
    setResult(null);
    const reader=new FileReader();
    reader.onload=e=>{setMedia(e.target.result);setMediaType(isImg?"image":"video");setB64(e.target.result.split(",")[1]);};
    reader.readAsDataURL(f);
  };

  const analyze=async()=>{
    if(!b64||loading) return;
    if(!API_KEY){setResult("Introduce tu API key arriba para continuar.");return;}
    setLoading(true);setResult(null);
    try{
      let content;
      if(mediaType==="image"){
        content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:"Analiza esta imagen e identifica qué mecánica de Rocket League aparece, cómo ejecutarla y cómo mejorarla."}];
      }else{
        const video=document.createElement("video");
        video.src=media;
        await new Promise(r=>{video.onloadeddata=r;});
        const canvas=document.createElement("canvas");
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        canvas.getContext("2d").drawImage(video,0,0);
        const frameB64=canvas.toDataURL("image/jpeg").split(",")[1];
        content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:frameB64}},{type:"text",text:"Este es un frame de un vídeo de Rocket League. Identifica la mecánica, cómo ejecutarla y cómo mejorarla."}];
      }
      // Para análisis de imagen usamos Groq con llama con visión
      const imageContent = content.find(c=>c.type==="image");
      const textContent = content.find(c=>c.type==="text");
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
        body:JSON.stringify({
          model:"meta-llama/llama-4-scout-17b-16e-instruct",
          max_tokens:1200,
          messages:[
            {role:"system",content:SYSTEM_MECANICA},
            {role:"user",content:[
              {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+imageContent.source.data}},
              {type:"text",text:textContent.text}
            ]}
          ],
        }),
      });
      const data=await res.json();
      if(data.error) throw new Error(data.error.message);
      setResult(data.choices[0].message.content);
    }catch(e){setResult("Error al analizar. Inténtalo de nuevo.");}
    setLoading(false);
  };

  return(
    <div>
      <div style={{textAlign:"center",marginBottom:22}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1rem",fontWeight:800,letterSpacing:2,textTransform:"uppercase",color:"#fff",marginBottom:5}}>Analizar Mecánica</div>
        <p style={{color:"rgba(255,255,255,0.3)",fontSize:"0.82rem"}}>Sube una imagen o vídeo y la IA identifica la mecánica</p>
      </div>
      <label className="file-drop fade-in" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}>
        <input type="file" accept="image/*,video/*" style={{position:"absolute",opacity:0,width:0,height:0}} onChange={e=>handleFile(e.target.files[0])}/>
        {media?(
          mediaType==="image"
            ?<img src={media} alt="preview" style={{maxWidth:"100%",maxHeight:260,borderRadius:8,objectFit:"contain"}}/>
            :<video src={media} controls style={{maxWidth:"100%",maxHeight:260,borderRadius:8}}/>
        ):(
          <div>
            <div style={{fontSize:"2rem",marginBottom:8}}>📸</div>
            <p style={{color:"rgba(255,255,255,0.36)",fontSize:"0.86rem"}}>Toca para subir imagen o vídeo</p>
            <p style={{color:"rgba(255,255,255,0.18)",fontSize:"0.72rem",marginTop:4}}>JPG · PNG · MP4 · MOV</p>
          </div>
        )}
      </label>
      {media&&(
        <div style={{display:"flex",gap:9,marginTop:12,justifyContent:"center"}}>
          <button className="btn-ghost" onClick={()=>{setMedia(null);setB64(null);setResult(null);}}>Cambiar</button>
          <button className="btn-blue" onClick={analyze} disabled={loading} style={{padding:"11px 26px"}}>{loading?"Analizando...":"Analizar"}</button>
        </div>
      )}
      {loading&&<div className="card fade-in" style={{marginTop:16,textAlign:"center",padding:"22px"}}><Dots/><p style={{color:"rgba(255,255,255,0.28)",fontSize:"0.8rem",marginTop:10}}>Analizando...</p></div>}
      {result&&!loading&&<div className="card fade-in" style={{marginTop:16,fontSize:"0.88rem",color:"rgba(200,214,229,0.88)",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{result}</div>}
    </div>
  );
}

function ApiBanner({onSave}){
  const [key,setKey]=useState("");
  const [saved,setSaved]=useState(!!API_KEY);
  if(saved) return(
    <div className="api-banner">
      <span style={{fontSize:"0.78rem",color:"rgba(255,255,255,0.45)"}}>🔑 API Key configurada</span>
      <button className="btn-ghost" style={{fontSize:"0.7rem"}} onClick={()=>{API_KEY="";localStorage.removeItem("rlcoach_key");setSaved(false);}}>Cambiar</button>
    </div>
  );
  return(
    <div className="api-banner">
      <span style={{fontSize:"0.78rem",color:"#ff5500",whiteSpace:"nowrap",fontWeight:700}}>🔑 API Key:</span>
      <input className="api-input" type="password" placeholder="gsk_..." value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&key.trim()){API_KEY=key.trim();localStorage.setItem("rlcoach_key",API_KEY);setSaved(true);onSave();}}}/>
      <button className="btn-blue" style={{padding:"7px 16px",fontSize:"0.72rem"}} onClick={()=>{if(key.trim()){API_KEY=key.trim();localStorage.setItem("rlcoach_key",API_KEY);setSaved(true);onSave();}}}>Guardar</button>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("diagnostico");
  const [routine,setRoutine]=useState(null);
  const [,forceUpdate]=useState(0);

  useEffect(()=>{
    const saved=localStorage.getItem("rlcoach-routine");
    if(saved){try{setRoutine(JSON.parse(saved));}catch{}}
  },[]);

  const saveRoutine=r=>{
    setRoutine(r);
    if(r){localStorage.setItem("rlcoach-routine",JSON.stringify(r));setTab("rutina");}
    else localStorage.removeItem("rlcoach-routine");
  };

  const updateRank=newRank=>{
    if(!routine) return;
    saveRoutine({...routine,rango:newRank,nombre:routine.nombre+" (actualizada)"});
  };

  const tabs=[
    {id:"diagnostico",icon:"🔍",label:"Diagnóstico"},
    {id:"rutina",icon:"📅",label:routine?"Mi Rutina ✓":"Mi Rutina"},
    {id:"chat",icon:"💬",label:"Coach"},
    {id:"analizar",icon:"📸",label:"Analizar"},
  ];

  return(
    <div style={{minHeight:"100vh",position:"relative"}}>
      <ApiBanner onSave={()=>forceUpdate(n=>n+1)}/>
      <nav className="nav" style={{position:"relative",zIndex:100}}>
        <div className="logo">RL<span className="logo-dot">·</span>COACH</div>
        <div className="nav-sub">Entrenador IA</div>
      </nav>

      <div className="main">
        {tab==="diagnostico"&&<DiagnosticoSection savedRoutine={routine} onRoutineSaved={saveRoutine}/>}
        {tab==="rutina"&&(routine
          ?<RoutineView routine={routine} onReset={()=>saveRoutine(null)} onUpdateRank={updateRank}/>
          :<div style={{maxWidth:460,margin:"60px auto",textAlign:"center"}}>
            <div style={{fontSize:"2.2rem",marginBottom:14}}>📅</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"0.95rem",fontWeight:800,letterSpacing:2,color:"rgba(255,255,255,0.38)",marginBottom:14,textTransform:"uppercase"}}>Aún no tienes rutina</div>
            <p style={{color:"rgba(255,255,255,0.28)",marginBottom:22,lineHeight:1.7}}>Completa el diagnóstico para generar tu rutina personalizada.</p>
            <button className="btn-boost" onClick={()=>setTab("diagnostico")}>Ir al diagnóstico</button>
          </div>
        )}
        {tab==="chat"&&<ChatSection/>}
        {tab==="analizar"&&<AnalizarSection/>}
      </div>

      <div className="bnav">
        {tabs.map(t=>(
          <button key={t.id} className={`bnav-btn${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
            <span className="bnav-icon">{t.icon}</span>
            <span className="bnav-label">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
