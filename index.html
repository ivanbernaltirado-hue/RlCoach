<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RLCoach Pro - Expert Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* (Estilos originales mantenidos) */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080b12;color:#fff;font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}
.arena-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 120% 60% at 50% 100%,#001830 0%,#080b12 60%);}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:rgba(8,11,18,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,170,255,0.15);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#fff,#0af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.main{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:20px 15px 100px;}
.card{background:rgba(13,20,32,0.85);border:1px solid rgba(0,170,255,0.15);border-radius:16px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.5);margin-bottom:20px;}
.btn-option{display:block;width:100%;padding:15px;margin-bottom:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,170,255,0.2);border-radius:8px;color:#fff;text-align:left;cursor:pointer;transition:0.2s;}
.btn-boost{background:linear-gradient(135deg,#ff5500,#ff2200);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;padding:15px 30px;cursor:pointer;box-shadow:0 0 20px rgba(255,85,0,0.4);text-transform:uppercase;letter-spacing:2px;}
.progress-container{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin:20px 0;overflow:hidden;}
.progress-bar{height:100%;background:#0af;transition:width 0.4s ease;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(8,11,18,0.95);backdrop-filter:blur(15px);border-top:1px solid rgba(0,170,255,0.1);padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px;background:transparent;border:none;color:rgba(255,255,255,0.3);cursor:pointer;}
.bnav-btn.active{color:#0af;}
.bnav-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;margin-top:4px;}
/* Sugerencias estilo píldora */
.pill-container{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
.pill{background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.25);border-radius:20px;padding:8px 16px;font-size:0.75rem;cursor:pointer;transition:0.2s;color:rgba(255,255,255,0.7);}
.pill:hover{background:rgba(0,170,255,0.15);border-color:#0af;color:#fff;}
.msg-input{background:rgba(255,255,255,0.04);border:1px solid rgba(0,170,255,0.14);border-radius:6px;color:#fff;padding:11px 14px;resize:none;outline:none;width:100%;}
.api-banner{background:rgba(255,85,0,0.1);border-bottom:1px solid rgba(255,85,0,0.2);padding:10px;display:flex;justify-content:center;gap:10px;}
.api-input{background:#000;border:1px solid #ff550044;color:#fff;padding:5px 10px;border-radius:4px;width:200px;}
.code-badge{background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.22);border-radius:3px;color:#0af;font-size:0.62rem;padding:2px 8px;}
.tag{padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:800;text-transform:uppercase;border:1px solid;}
.tag-f{background:#4caf5022;color:#4caf50;border-color:#4caf5044;}
.tag-m{background:#ffc10722;color:#ffc107;border-color:#ffc10744;}
.tag-d{background:#f4433622;color:#f44336;border-color:#f4433644;}
</style>
</head>
<body>
<div class="arena-bg"></div>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const KNOWLEDGE_BASE = `Lógica: Rocket League sin RNG. Físicas de momentum y spin. Pads 12/100. Prioridad Recoveries > Tiro. Mecánicas: Speed flip, Musty, Breezi, Reset, Shadow defense. Maps: 6EB1-79B2-33B8-681C (Tiro), 5CCE-FB29-7B05-A0B1 (Shadow).`;

const QUESTIONS = [
  {q: "¿Cuál es tu rango actual?", opt: ["Bronce - Oro", "Platino - Diamante", "Champion - SSL"]},
  {q: "¿Cómo es tu gestión de boost?", opt: ["Busco siempre el de 100", "Uso algunos pads pequeños", "Rutas de pads dominadas"]},
  {q: "¿Dominas los Recoveries básicos?", opt: ["Me cuesta caer bien", "Hago Half-flips", "Uso Wave dashes y Zap dashes"]},
  {q: "¿Qué tal tus tiros a puerta?", opt: ["Fallo balones fáciles", "Tiro con potencia a veces", "Power shots y botes consistentes"]},
  {q: "¿Cómo vas de velocidad aérea?", opt: ["Tardo en saltar", "Hago Fast Aerials", "Control total con Air Roll"]},
  {q: "¿Tu Shadow Defense es sólida?", opt: ["No sé qué es", "Intento retroceder", "Defiendo bien desde atrás"]},
  {q: "¿Usas mecánicas de pared?", opt: ["Me mareo en la pared", "Hago clearing básico", "Air dribbles y wall shots"]},
  {q: "¿Qué tal el Kickoff?", opt: ["Solo pulso boost", "Hago diagonal flip", "Speed flip consistente"]},
  {q: "¿Entiendes las rotaciones 3v3?", opt: ["Voy siempre al balón", "Intento no hacer double commit", "Rotación fluida 1st/2nd/3rd"]},
  {q: "¿En qué quieres enfocarte hoy?", opt: ["Mecánicas llamativas", "Consistencia y rango", "Velocidad y lecturas"]}
];

const SUGGESTIONS_BANK = [
  "¿Cómo hago un musty flick?", "¿Rotaciones en 2v2?", "¿Cómo mejorar el boost?", 
  "¿Qué es un flip reset?", "¿Speed flip kickoff?", "¿Mejor hitbox para flicks?", 
  "¿Cómo evitar el tilt?", "¿Cuándo hacer shadow defense?", "¿Cómo entrenar recoveries?",
  "¿Para qué sirve el zap dash?", "¿Cómo hacer un fast aerial?", "¿Configuración de cámara pro?"
];

let API_KEY = localStorage.getItem("rlcoach_groq_key") || "";

async function callGroq(messages, json=false) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}`},
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [{role: "system", content: `Eres RLCoach Pro. Basado en: ${KNOWLEDGE_BASE}.`}, ...messages],
      response_format: json ? {type: "json_object"} : {type: "text"}
    })
  });
  const data = await res.json();
  return data.choices[0].message.content;
}

function App() {
  const [tab, setTab] = useState("test");
  const [routine, setRoutine] = useState(JSON.parse(localStorage.getItem("rl_routine")));
  const [key, setKey] = useState(API_KEY);

  return (
    <div>
      <div className="api-banner">
        <input className="api-input" type="password" placeholder="Groq API Key" value={key} onChange={e=>{setKey(e.target.value); localStorage.setItem("rlcoach_groq_key", e.target.value); API_KEY=e.target.value;}}/>
      </div>
      <nav className="nav"><div className="logo">RLCOACH <span style={{color:"#ff5500"}}>PRO</span></div></nav>
      
      <div className="main">
        {tab === "test" && <TestSection onFinish={(r)=> {setRoutine(r); setTab("plan");}}/>}
        {tab === "plan" && (routine ? <RoutineView routine={routine} onReset={()=>setTab("test")}/> : <p style={{textAlign:"center", marginTop:50}}>Haz el diagnóstico para ver tu rutina.</p>)}
        {tab === "chat" && <ChatSection/>}
      </div>

      <div className="bnav">
        <button className={`bnav-btn ${tab==="test"?"active":""}`} onClick={()=>setTab("test")}>🔍<span className="bnav-label">Test</span></button>
        <button className={`bnav-btn ${tab==="plan"?"active":""}`} onClick={()=>setTab("plan")}>📅<span className="bnav-label">Rutina</span></button>
        <button className={`bnav-btn ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")}>💬<span className="bnav-label">Coach</span></button>
      </div>
    </div>
  );
}

function TestSection({onFinish}) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [extra, setExtra] = useState("");
  const [loading, setLoading] = useState(false);

  const handleOption = (opt) => {
    const newAnswers = [...answers, {q: QUESTIONS[step].q, a: opt}];
    setAnswers(newAnswers);
    setStep(step + 1);
  };

  const generate = async () => {
    setLoading(true);
    const prompt = `Resultados test: ${JSON.stringify(answers)}. Notas: ${extra}. Genera rutina JSON completa.`;
    try {
      const res = await callGroq([{role: "user", content: prompt}], true);
      const json = JSON.parse(res);
      localStorage.setItem("rl_routine", JSON.stringify(json));
      onFinish(json);
    } catch(e) { alert("API Error. Revisa la key."); }
    setLoading(false);
  };

  if (loading) return <div className="card" style={{textAlign:"center", padding:"50px 20px"}}><div style={{animation: "bounce 1s infinite", fontSize:"2rem"}}>🚀</div><h3>Construyendo tu plan maestro...</h3></div>;

  if (step >= QUESTIONS.length) {
    return (
      <div className="card">
        <h2>Puntos extra</h2>
        <textarea className="msg-input" style={{height:120, margin:"20px 0"}} value={extra} onChange={e=>setExtra(e.target.value)} placeholder="¿Algo más? (Ej: Solo 30 min, mejorar flicks...)"/>
        <button className="btn-boost" style={{width:"100%"}} onClick={generate}>Generar Rutina Pro</button>
      </div>
    );
  }

  return (
    <div className="card">
      <div className="progress-container"><div className="progress-bar" style={{width: `${(step/10)*100}%`}}/></div>
      <h2 style={{marginBottom:25, fontSize:"1.2rem"}}>{QUESTIONS[step].q}</h2>
      {QUESTIONS[step].opt.map((o,i) => (
        <button key={i} className="btn-option" onClick={()=>handleOption(o)}>{o}</button>
      ))}
    </div>
  );
}

function RoutineView({routine, onReset}) {
  return (
    <div>
      <div className="card" style={{borderLeft:"4px solid #0af"}}>
        <h1 style={{fontFamily:'Barlow Condensed', fontSize:"1.8rem"}}>{routine.nombre}</h1>
        <p style={{color:"#0af", fontWeight:800, fontSize:"0.8rem", textTransform:"uppercase"}}>{routine.rango} | {routine.meta}</p>
        <button className="btn-boost" style={{marginTop:15, padding:"6px 15px", fontSize:"0.7rem"}} onClick={onReset}>Nuevo Test</button>
      </div>
      {routine.dias.map((d, i) => (
        <div key={i} className="card">
          <h3 style={{color:"#ff5500", marginBottom:15, borderBottom:"1px solid #ff550033", paddingBottom:5}}>{d.dia} - {d.enfoque}</h3>
          {d.ejercicios.map((ej, j) => (
            <div key={j} style={{background:"rgba(0,0,0,0.2)", padding:15, borderRadius:10, marginBottom:10}}>
              <div style={{display:"flex", justifyContent:"space-between"}}>
                <strong style={{fontSize:"0.9rem"}}>{ej.nombre}</strong>
                <span className={`tag ${ej.dificultad==="facil"?"tag-f":ej.dificultad==="media"?"tag-m":"tag-d"}`}>{ej.dificultad}</span>
              </div>
              <p style={{fontSize:"0.75rem", margin:"8px 0", opacity:0.7}}>{ej.descripcion}</p>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <span className="code-badge">{ej.codigo}</span>
                <span style={{fontSize:"0.7rem", opacity:0.8}}>{ej.duracion}</span>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function ChatSection() {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);

  // Mezclar sugerencias al azar al entrar
  const suggestions = useMemo(() => {
    return [...SUGGESTIONS_BANK].sort(() => 0.5 - Math.random()).slice(0, 5);
  }, []);

  const send = async (txt) => {
    const val = txt || input;
    if(!val.trim()) return;
    const nm = [...msgs, {role:"user", content:val}];
    setMsgs(nm); setInput(""); setLoading(true);
    try {
      const res = await callGroq(nm);
      setMsgs([...nm, {role:"assistant", content:res}]);
    } catch(e) { alert("Error en el chat."); }
    setLoading(false);
  };

  return (
    <div style={{display:"flex", flexDirection:"column", height:"75vh"}}>
      <div style={{flex:1, overflowY:"auto", padding:10}}>
        {msgs.length === 0 && (
          <div style={{textAlign:"center", marginTop:20}}>
            <div style={{fontSize:"2rem", marginBottom:10}}>💬</div>
            <p style={{opacity:0.5, marginBottom:20, fontSize:"0.9rem"}}>Cualquier duda sobre Rocket League...</p>
            <div className="pill-container">
              {suggestions.map((s,i) => (
                <div key={i} className="pill" onClick={()=>send(s)}>{s}</div>
              ))}
            </div>
          </div>
        )}
        {msgs.map((m,i)=>(
          <div key={i} className="card" style={{padding:15, marginBottom:10, borderLeft: m.role==="user"?"4px solid #ff5500":"4px solid #0af", background: m.role==="user"?"rgba(255,85,0,0.05)":"rgba(0,170,255,0.05)"}}>
            <div style={{fontSize:"0.6rem", opacity:0.4, marginBottom:5, textTransform:"uppercase"}}>{m.role === "user" ? "Tú" : "Coach"}</div>
            <div style={{fontSize:"0.9rem"}}>{m.content}</div>
          </div>
        ))}
        {loading && <div className="dot" style={{margin:"10px auto"}}/>}
      </div>
      <div style={{display:"flex", gap:10, padding:10, background:"rgba(8,11,18,0.9)", borderTop:"1px solid rgba(0,170,255,0.1)"}}>
        <textarea className="msg-input" value={input} onChange={e=>setInput(e.target.value)} placeholder="Escribe tu pregunta..."/>
        <button onClick={()=>send()} style={{background:"#ff5500", border:"none", color:"#fff", padding:"0 15px", borderRadius:8, fontWeight:800, fontSize:"0.7rem", cursor:"pointer"}}>ENVIAR</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
