<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RLCoach Pro - Ultimate Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--orange:#ff5500;--blue:#00aaff;--bg:#080b12;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:#fff;font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}
.arena-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 120% 60% at 50% 100%,#001830 0%,#080b12 60%);}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;height:60px;background:rgba(8,11,18,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,170,255,0.15);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#fff,#0af);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.main{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:20px 15px 100px;}
.card{background:rgba(13,20,32,0.85);border:1px solid rgba(0,170,255,0.15);border-radius:16px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.5);margin-bottom:20px;}
.api-banner{background:rgba(255,85,0,0.15);border:1px solid var(--orange);padding:15px;border-radius:12px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px;align-items:center;}
.api-input{background:#000;border:1px solid var(--orange);color:#fff;padding:10px;border-radius:6px;width:100%;text-align:center;outline:none;}
.btn-boost{background:linear-gradient(135deg,var(--orange),#ff2200);border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;padding:12px 25px;cursor:pointer;box-shadow:0 0 15px rgba(255,85,0,0.3);text-transform:uppercase;}
.btn-option{display:block;width:100%;padding:15px;margin-bottom:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,170,255,0.2);border-radius:8px;color:#fff;text-align:left;cursor:pointer;transition:0.2s;}
.btn-option:hover{background:rgba(0,170,255,0.15);border-color:var(--blue);}
.progress-bar{height:6px;background:var(--blue);transition:width 0.4s ease;border-radius:3px;}
.pill-container{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0;}
.pill{background:rgba(0,170,255,0.1);border:1px solid rgba(0,170,255,0.3);border-radius:20px;padding:8px 15px;font-size:0.75rem;cursor:pointer;transition:0.2s;}
.pill:hover{background:var(--blue);color:#000;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(8,11,18,0.95);backdrop-filter:blur(15px);border-top:1px solid rgba(0,170,255,0.2);padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px;background:transparent;border:none;color:rgba(255,255,255,0.3);cursor:pointer;}
.bnav-btn.active{color:var(--blue);}
.bnav-label{font-size:0.6rem;font-weight:800;text-transform:uppercase;margin-top:4px;}
.dot{width:8px;height:8px;background:var(--blue);border-radius:50%;display:inline-block;margin:0 3px;animation:bounce 0.6s infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.msg-input{background:rgba(0,0,0,0.3);border:1px solid rgba(0,170,255,0.2);border-radius:8px;color:#fff;padding:12px;width:100%;outline:none;resize:none;}
.tag{padding:2px 8px;border-radius:4px;font-size:0.65rem;font-weight:800;text-transform:uppercase;border:1px solid;}
.tag-f{color:#4caf50;border-color:#4caf5044;}
.tag-m{color:#ffc107;border-color:#ffc10744;}
.tag-d{color:#f44336;border-color:#f4433644;}
</style>
</head>
<body>
<div class="arena-bg"></div>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useMemo} = React;

const KNOWLEDGE = `Guía Rocket League: Física sin RNG, Momentum, Pads 12/100. Prioridad Recoveries. Mecánicas: Musty, Speedflip, Zapdash, Reset.`;

const QUESTIONS = [
    {q: "¿Rango actual?", opt: ["Bronce - Oro", "Platino - Diamante", "Champion - SSL"]},
    {q: "¿Gestión de boost?", opt: ["Solo 100s", "Uso algunos pads", "Rutas perfectas"]},
    {q: "¿Recoveries?", opt: ["Malos", "Half-flips ok", "Wave/Zap dashes"]},
    {q: "¿Puntería?", opt: ["Fallo mucho", "Tiros fuertes", "Power shots ok"]},
    {q: "¿Vuelo?", opt: ["Lento", "Fast aerial ok", "Air Roll pro"]},
    {q: "¿Defensa?", opt: ["Portería", "Shadow ok", "Backboard pro"]},
    {q: "¿Paredes?", opt: ["Difícil", "Básico", "Air dribbles"]},
    {q: "¿Kickoff?", opt: ["Boost", "Diagonal", "Speedflip"]},
    {q: "¿Rotación?", opt: ["Caos", "Intento", "Estructurada"]},
    {q: "¿Objetivo?", opt: ["Freestyle", "Subir Rango", "Velocidad"]}
];

const SUGGESTIONS = ["¿Cómo hago un musty?", "¿Rotación 2v2?", "¿Mejorar boost?", "¿Qué es un zap dash?", "¿Speedflip kickoff?", "¿Cómo evitar el tilt?"];

let G_KEY = localStorage.getItem("rl_key") || "";

async function fetchGroq(msgs, isJson=false, model="llama-3.3-70b-versatile") {
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {"Content-Type": "application/json", "Authorization": `Bearer ${G_KEY}`},
        body: JSON.stringify({
            model, messages: [{role:"system", content:`Eres RLCoach Pro experto. Usa: ${KNOWLEDGE}`}, ...msgs],
            response_format: isJson ? {type:"json_object"} : {type:"text"}
        })
    });
    const d = await r.json();
    return d.choices[0].message.content;
}

function App() {
    const [tab, setTab] = useState("test");
    const [key, setKey] = useState(G_KEY);
    const [routine, setRoutine] = useState(JSON.parse(localStorage.getItem("rl_routine")));

    const saveKey = (v) => { setKey(v); G_KEY = v; localStorage.setItem("rl_key", v); };

    return (
        <div>
            <nav className="nav"><div className="logo">RLCOACH <span style={{color:"#ff5500"}}>PRO</span></div></nav>
            <div className="main">
                {!key && (
                    <div className="api-banner">
                        <h3>🔑 CONFIGURA TU API KEY</h3>
                        <input className="api-input" type="password" value={key} onChange={e=>saveKey(e.target.value)} placeholder="gsk_..."/>
                        <p style={{fontSize:"0.7rem", opacity:0.6}}>Consíguela gratis en console.groq.com</p>
                    </div>
                )}
                
                {tab === "test" && <TestView onDone={(r)=>{setRoutine(r); setTab("plan");}}/>}
                {tab === "plan" && (routine ? <RoutineView routine={routine} onReset={()=>setTab("test")}/> : <p>Sin rutina.</p>)}
                {tab === "chat" && <ChatView/>}
                {tab === "analizar" && <VisionView/>}
            </div>

            <div className="bnav">
                <button className={`bnav-btn ${tab==="test"?"active":""}`} onClick={()=>setTab("test")}>🔍<span className="bnav-label">Test</span></button>
                <button className={`bnav-btn ${tab==="plan"?"active":""}`} onClick={()=>setTab("plan")}>📅<span className="bnav-label">Rutina</span></button>
                <button className={`bnav-btn ${tab==="chat"?"active":""}`} onClick={()=>setTab("chat")}>💬<span className="bnav-label">Coach</span></button>
                <button className={`bnav-btn ${tab==="analizar"?"active":""}`} onClick={()=>setTab("analizar")}>📸<span className="bnav-label">Analizar</span></button>
            </div>
        </div>
    );
}

function TestView({onDone}) {
    const [step, setStep] = useState(0);
    const [ans, setAns] = useState([]);
    const [load, setLoad] = useState(false);

    const next = async (o) => {
        const newAns = [...ans, {q: QUESTIONS[step].q, a: o}];
        if(step < 9) { setAns(newAns); setStep(step+1); }
        else {
            setLoad(true);
            try {
                const res = await fetchGroq([{role:"user", content: `Analiza: ${JSON.stringify(newAns)}. Genera rutina JSON.`}], true);
                const j = JSON.parse(res);
                localStorage.setItem("rl_routine", res);
                onDone(j);
            } catch(e){ alert("Error API"); }
            setLoad(false);
        }
    };

    if(load) return <div className="card" style={{textAlign:"center"}}><div className="dot"/><div className="dot"/><div className="dot"/><h3>CALIBRANDO...</h3></div>;

    return (
        <div className="card">
            <div style={{height:4, background:"#222", borderRadius:2, marginBottom:20}}><div className="progress-bar" style={{width:`${(step+1)*10}%`}}/></div>
            <h2 style={{marginBottom:20}}>{QUESTIONS[step].q}</h2>
            {QUESTIONS[step].opt.map(o=><button key={o} className="btn-option" onClick={()=>next(o)}>{o}</button>)}
        </div>
    );
}

function RoutineView({routine, onReset}) {
    return (
        <div>
            <div className="card" style={{borderLeft:"4px solid #ff5500"}}>
                <h2>{routine.nombre || "Tu Plan Pro"}</h2>
                <button className="btn-boost" style={{marginTop:10, padding:"5px 15px", fontSize:"0.7rem"}} onClick={onReset}>REPETIR TEST</button>
            </div>
            {routine.dias?.map((d,i)=>(
                <div key={i} className="card">
                    <h3 style={{color:"#0af"}}>{d.dia} - {d.enfoque}</h3>
                    {d.ejercicios.map((e,j)=>(
                        <div key={j} style={{marginTop:15, padding:10, background:"rgba(0,0,0,0.2)", borderRadius:8}}>
                            <div style={{display:"flex", justifyContent:"space-between"}}>
                                <strong>{e.nombre}</strong>
                                <span className={`tag tag-${e.dificultad === "facil" ? "f" : e.dificultad === "media" ? "m" : "d"}`}>{e.dificultad}</span>
                            </div>
                            <p style={{fontSize:"0.8rem", opacity:0.7, margin:"5px 0"}}>{e.descripcion}</p>
                            <code style={{color:"#0af", fontSize:"0.7rem"}}>{e.codigo}</code>
                        </div>
                    ))}
                </div>
            ))}
        </div>
    );
}

function ChatView() {
    const [ms, setMs] = useState([]);
    const [inpt, setInpt] = useState("");
    const pills = useMemo(()=> [...SUGGESTIONS].sort(()=>.5-Math.random()).slice(0,4), []);

    const send = async (t) => {
        const v = t || inpt; if(!v) return;
        const n = [...ms, {role:"user", content:v}]; setMs(n); setInpt("");
        const r = await fetchGroq(n);
        setMs([...n, {role:"assistant", content:r}]);
    };

    return (
        <div style={{height:"70vh", display:"flex", flexDirection:"column"}}>
            <div style={{flex:1, overflowY:"auto", padding:10}}>
                {ms.length === 0 && <div className="pill-container">{pills.map(p=><div key={p} className="pill" onClick={()=>send(p)}>{p}</div>)}</div>}
                {ms.map((m,i)=><div key={i} className="card" style={{padding:12, marginBottom:10, borderLeft: m.role==="user"?"3px solid #f50":"3px solid #0af"}}>{m.content}</div>)}
            </div>
            <div style={{display:"flex", gap:10}}><textarea className="msg-input" value={inpt} onChange={e=>setInpt(e.target.value)}/><button className="btn-boost" onClick={()=>send()}>OK</button></div>
        </div>
    );
}

function VisionView() {
    const [img, setImg] = useState(null);
    const [res, setRes] = useState("");
    const [load, setLoad] = useState(false);

    const up = (e) => {
        const f = e.target.files[0];
        const r = new FileReader();
        r.onload = async () => {
            setImg(r.result); setLoad(true);
            try {
                const a = await fetchGroq([{role:"user", content:[{type:"text", text:"¿Qué mecánica es esta y cómo la mejoro?"}, {type:"image_url", image_url:{url:r.result}}]}], false, "llama-3.2-11b-vision-preview");
                setRes(a);
            } catch { setRes("Error analizando."); }
            setLoad(false);
        };
        r.readAsDataURL(f);
    };

    return (
        <div style={{textAlign:"center"}}>
            <div className="card">
                <h2>ANÁLISIS DE MECÁNICAS</h2>
                <input type="file" onChange={up} style={{margin:"20px 0"}}/>
                {img && <img src={img} style={{width:"100%", borderRadius:12}}/>}
                {load && <div className="dot"/>}
                {res && <div className="card" style={{marginTop:20, textAlign:"left"}}>{res}</div>}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
