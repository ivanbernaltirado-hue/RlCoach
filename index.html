<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RLCoach</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080b12;color:#fff;font-family:'Exo 2',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#0af3;border-radius:2px;}
.arena-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 120% 60% at 50% 100%,#001830 0%,#080b12 60%);}
.arena-floor{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,rgba(0,100,200,0.07),transparent);border-top:1px solid rgba(0,170,255,0.08);}
.arena-line{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:2px;height:35%;background:linear-gradient(to top,rgba(0,170,255,0.35),transparent);}
.arena-circle{position:absolute;bottom:0;left:50%;transform:translateX(-50%) scaleY(0.3);width:400px;height:400px;border-radius:50%;border:1px solid rgba(0,170,255,0.1);}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:rgba(8,11,18,0.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,170,255,0.1);}
.nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,170,255,0.5),rgba(255,85,0,0.4),transparent);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#fff 30%,#0af 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo span{-webkit-text-fill-color:#ff5500;}
.nav-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:2px;color:rgba(255,255,255,0.22);}
.api-bar{background:rgba(255,85,0,0.08);border-bottom:1px solid rgba(255,85,0,0.18);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:99;}
.api-bar label{font-size:0.78rem;color:#ff5500;font-weight:700;white-space:nowrap;}
.api-bar input{background:rgba(0,0,0,0.3);border:1px solid rgba(255,85,0,0.28);border-radius:6px;color:#fff;font-size:0.85rem;padding:7px 12px;outline:none;flex:1;min-width:180px;}
.btn{border:none;border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;transition:all 0.2s;}
.btn-blue{background:linear-gradient(135deg,#0af,#0055cc);color:#fff;font-size:0.78rem;padding:9px 20px;box-shadow:0 0 20px rgba(0,170,255,0.3);}
.btn-blue:hover{transform:translateY(-1px);box-shadow:0 0 35px rgba(0,170,255,0.5);}
.btn-blue:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-orange{background:linear-gradient(135deg,#ff5500,#ff2200);color:#fff;font-size:0.9rem;padding:14px 40px;box-shadow:0 0 30px rgba(255,85,0,0.4);}
.btn-orange:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(255,85,0,0.6);}
.btn-orange:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-red{background:linear-gradient(135deg,#ef5350,#b71c1c);color:#fff;font-size:0.72rem;padding:9px 16px;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.13);border-radius:6px;color:rgba(255,255,255,0.45);font-family:'Exo 2',sans-serif;font-size:0.78rem;padding:8px 14px;cursor:pointer;transition:all 0.2s;}
.btn-ghost:hover{border-color:rgba(255,85,0,0.4);color:rgba(255,85,0,0.8);}
.btn-send{background:linear-gradient(135deg,#ff5500,#cc2200);color:#fff;font-size:0.7rem;padding:12px 16px;white-space:nowrap;box-shadow:0 0 18px rgba(255,85,0,0.3);}
.btn-send:hover{transform:translateY(-1px);}
.btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 90px;}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;background:rgba(8,11,18,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(0,170,255,0.1);}
.bnav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,170,255,0.5),rgba(255,85,0,0.4),transparent);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border:none;background:transparent;cursor:pointer;min-height:56px;}
.bnav-btn .icon{font-size:1.15rem;transition:transform 0.2s;}
.bnav-btn .lbl{font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.28);}
.bnav-btn.active .lbl{color:#0af;}
.bnav-btn.active .icon{transform:translateY(-2px);}
.bnav-btn.active::after{content:'';position:absolute;bottom:calc(56px - 2px);left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#0af,transparent);}
.card{background:rgba(13,20,32,0.8);border:1px solid rgba(0,170,255,0.1);border-radius:12px;padding:18px;}
.card-orange{background:rgba(255,85,0,0.06);border:1px solid rgba(255,85,0,0.16);border-radius:12px;padding:16px;}
.msg-input{background:rgba(255,255,255,0.04);border:1px solid rgba(0,170,255,0.14);border-radius:6px;color:#fff;font-family:'Exo 2',sans-serif;font-size:0.92rem;padding:11px 14px;resize:none;outline:none;width:100%;}
.msg-input:focus{border-color:rgba(0,170,255,0.4);}
.msg-input::placeholder{color:rgba(255,255,255,0.2);}
.pbar-bg{height:4px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:2px;transition:width 0.5s;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:10px;}
.hero-badge{display:inline-flex;align-items:center;background:rgba(255,85,0,0.1);border:1px solid rgba(255,85,0,0.28);border-radius:20px;padding:4px 14px;font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:2px;color:#ff5500;text-transform:uppercase;margin-bottom:16px;}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900;letter-spacing:4px;text-transform:uppercase;line-height:0.95;margin-bottom:12px;}
.rank-badge{padding:4px 11px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;display:inline-block;}
.step-card{background:rgba(13,20,32,0.8);border-radius:10px;padding:16px 10px;text-align:center;border:1px solid rgba(0,170,255,0.1);position:relative;overflow:hidden;}
.day-card{background:rgba(13,20,32,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.day-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.exercise{background:rgba(0,0,0,0.2);border-radius:8px;padding:10px 12px;border:1px solid rgba(255,255,255,0.04);margin-bottom:8px;}
.tag{display:inline-block;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:1px;padding:2px 7px;font-weight:700;text-transform:uppercase;}
.tag-f{background:rgba(76,175,80,0.15);color:#81c784;border:1px solid rgba(76,175,80,0.3);}
.tag-m{background:rgba(255,193,7,0.15);color:#ffd54f;border:1px solid rgba(255,193,7,0.3);}
.code-badge{background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.22);border-radius:3px;color:#0af;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:1px;padding:2px 8px;font-weight:700;}
.bubble{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;}
.bubble-user{justify-content:flex-end;}
.bubble-inner{max-width:80%;border-radius:4px 12px 12px 12px;padding:10px 14px;font-size:0.9rem;color:#c8d6e5;line-height:1.65;white-space:pre-wrap;border:1px solid rgba(0,170,255,0.1);background:rgba(255,255,255,0.04);}
.bubble-user .bubble-inner{border-radius:12px 12px 4px 12px;background:rgba(255,85,0,0.1);border-color:rgba(255,85,0,0.2);}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0af,#0044cc);display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;box-shadow:0 0 10px rgba(0,170,255,0.3);}
.dots span{display:inline-block;width:6px;height:6px;background:#0af;border-radius:50%;margin:0 2px;animation:bounce 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#0a1320;border:1px solid rgba(239,83,80,0.28);border-radius:16px;padding:28px;max-width:400px;width:100%;text-align:center;}
.file-drop{border:2px dashed rgba(0,170,255,0.22);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;display:block;width:100%;}
.sug-btn{background:rgba(0,170,255,0.05);border:1px solid rgba(0,170,255,0.13);border-radius:20px;color:rgba(255,255,255,0.42);font-family:'Exo 2',sans-serif;font-size:0.78rem;padding:6px 13px;cursor:pointer;}
.hidden{display:none!important;}
.routine-header{background:linear-gradient(135deg,rgba(13,20,32,0.9),rgba(0,30,60,0.4));border:1px solid rgba(0,170,255,0.14);border-radius:12px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden;}
.routine-header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#0af,#0055ff,transparent);}
@media(max-width:400px){.bnav-btn .lbl{font-size:0.52rem;}}
</style>
</head>
<body>
<div class="arena-bg"><div class="arena-floor"></div><div class="arena-line"></div><div class="arena-circle"></div></div>

<div class="api-bar" id="apiBanner">
  <label>🔑 API Key Groq:</label>
  <input type="password" id="apiKeyInput" placeholder="gsk_..."/>
  <button class="btn btn-blue" onclick="saveKey()">Guardar</button>
</div>
<div class="api-bar hidden" id="apiSaved" style="justify-content:space-between;">
  <span style="font-size:0.78rem;color:rgba(255,255,255,0.45)">🔑 API Key configurada</span>
  <button class="btn-ghost" onclick="removeKey()">Cambiar</button>
</div>

<nav class="nav" style="position:relative;z-index:100;">
  <div class="logo">RL<span>·</span>COACH</div>
  <div class="nav-sub">ENTRENADOR IA</div>
</nav>

<div class="main" id="mainContent">
  <!-- content rendered by JS -->
</div>

<div class="bnav" style="position:fixed;">
  <button class="bnav-btn active" id="tab-diagnostico" onclick="showTab('diagnostico')">
    <span class="icon">🔍</span><span class="lbl">Diagnóstico</span>
  </button>
  <button class="bnav-btn" id="tab-rutina" onclick="showTab('rutina')">
    <span class="icon">📅</span><span class="lbl" id="rutinaLabel">Mi Rutina</span>
  </button>
  <button class="bnav-btn" id="tab-chat" onclick="showTab('chat')">
    <span class="icon">💬</span><span class="lbl">Coach</span>
  </button>
  <button class="bnav-btn" id="tab-analizar" onclick="showTab('analizar')">
    <span class="icon">📸</span><span class="lbl">Analizar</span>
  </button>
</div>

<script>
const RANKS = ["Bronce","Plata","Oro","Platino","Diamante","Campeón","Gran Campeón","Leyenda Supersónica"];
const RANK_COLORS = {"Bronce":"#cd7f32","Plata":"#c0c0c0","Oro":"#ffd700","Platino":"#00d4ff","Diamante":"#4fc3f7","Campeón":"#ab47bc","Gran Campeón":"#ef5350","Leyenda Supersónica":"#ff5500"};

const KNOWLEDGE = `FÍSICA: Sin RNG. Todo depende de ángulo, velocidad e impacto. La pelota conserva momentum y spin. HITBOXES: Octane (equilibrio, la más usada), Dominus (flicks y redirects). BOOST: Pads pequeños=12, grandes=100. Usa pads pequeños para no abandonar jugadas. MOVILIDAD: Powerslide (girar sin perder velocidad), Wave dash (ganar velocidad aterrizando con dodge), Half flip (180° cancelando backflip), Speed flip (kickoff más rápido). TIROS: basic, power, bounce, hook, air roll, double taps, redirects, pinches. DRIBBLING: ground dribble (flicks/baits), bounce dribble. FLICKS: front, 45°, 90°, musty (backflip+parte trasera), breezi, mognus. AERIALS: fast aerial obligatorio rangos altos. Air roll L/R para control. AIR DRIBBLES: toque suave, mantener distancia, igualar velocidad. Ceiling air dribble desde techo. CEILING SHOTS: flip guardado en techo, disparar cuando quieras. FLIP RESETS: 4 ruedas sobre pelota, single/double/triple/psycho. DEFENSA: Shadow defense, backboard defense, prejump. ROTACIONES: first man presiona, second apoya, third defiende. Evitar dobles commits. DEMOS: destruir rival=espacio libre. RANGOS: Bronce→Plata→Oro→Platino→Diamante→Campeón→Gran Campeón→Leyenda Supersónica. PSICOLOGÍA: evitar tilt, consistencia mental clave. MAPAS: Tiro:6EB1-79B2-33B8-681C|7028-5E10-88EF-E83E. Aerials:F6D6-E749-4FDD-23C7. Dribbles:7067-44F0-A1C8-7DAC|3E84-2FCA-61B9-FE21. Air dribbles:9D87-258C-3C05-6FA9. Defensa:5CCE-FB29-7B05-A0B1|99E5-4AA3-60D5-44BD. Recoveries:A503-264C-A7EB-D282|0E99-5226-7A42-569C|1E5E-5D7F-5D82-6C5B. ORDEN MEJORA: 1.Recoveries 2.Tiro 3.Fast aerials 4.Rotaciones 5.Dribbling 6.Flicks 7.Air dribbles 8.Flip resets`;

const SYSTEM_COACH = `Eres RLCoach, entrenador experto de Rocket League. ${KNOWLEDGE}
PREGUNTAS (una por una):
1. Control del coche: powerslide, half-flip, wave dash, air roll?
2. Qué falla más: tiros o rotaciones?
3. Gestión del boost: te quedas sin boost o recoges pads pequeños?
4. Mecánica aérea: qué dominas y qué te cuesta?
5. Días por semana y tiempo por sesión?
6. Rango actual? (Bronce/Plata/Oro/Platino/Diamante/Campeón/Gran Campeón/Leyenda Supersónica)
Cuando tengas TODAS las respuestas responde SOLO con este JSON sin texto extra:
{"tipo":"rutina","nombre":"Nombre motivador","rango":"rango","diagnostico":"resumen","meta":"meta 2-4 semanas","dias":[{"dia":"Lunes","tiempo":"45 min","enfoque":"Recoveries","ejercicios":[{"nombre":"Recovery training","codigo":"1E5E-5D7F-5D82-6C5B","duracion":"15 min","dificultad":"facil","descripcion":"desc"}],"areas":[{"area":"Recoveries","porcentaje":50}]}],"consejos":["c1","c2"]}
REGLAS: Habla español. Bronce-Oro: recoveries+tiro+rotaciones, NO flip resets. Platino-Diamante: aerials+dribbling+flicks. Campeón+: air dribbles+flip resets. Empieza con bienvenida y primera pregunta.`;

const SYSTEM_CHAT = `Eres RLCoach, entrenador experto de Rocket League. ${KNOWLEDGE} Responde en español, claro y práctico.`;
const SYSTEM_MECANICA = `Eres experto en mecánicas de Rocket League. ${KNOWLEDGE} Identifica la mecánica, explica cómo ejecutarla, da consejos y recomienda mapas con códigos. Responde en español.`;

let apiKey = localStorage.getItem("rlcoach_key") || "";
let currentTab = "diagnostico";
let diagMessages = [];
let diagQNum = 0;
let diagPhase = "landing";
let chatMessages = [];
let savedRoutine = null;
let diagLoading = false;
let chatLoading = false;

// Init
window.onload = function() {
  const saved = localStorage.getItem("rlcoach-routine");
  if (saved) { try { savedRoutine = JSON.parse(saved); } catch(e){} }
  if (savedRoutine) diagPhase = "done";
  updateKeyBanner();
  updateRutinaLabel();
  showTab("diagnostico");
};

function updateKeyBanner() {
  if (apiKey) {
    document.getElementById("apiBanner").classList.add("hidden");
    document.getElementById("apiSaved").classList.remove("hidden");
  } else {
    document.getElementById("apiBanner").classList.remove("hidden");
    document.getElementById("apiSaved").classList.add("hidden");
  }
}

function saveKey() {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) return;
  apiKey = val;
  localStorage.setItem("rlcoach_key", apiKey);
  updateKeyBanner();
}

function removeKey() {
  apiKey = "";
  localStorage.removeItem("rlcoach_key");
  document.getElementById("apiKeyInput").value = "";
  updateKeyBanner();
}

function updateRutinaLabel() {
  document.getElementById("rutinaLabel").textContent = savedRoutine ? "Mi Rutina ✓" : "Mi Rutina";
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".bnav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  const main = document.getElementById("mainContent");
  if (tab === "diagnostico") renderDiagnostico(main);
  else if (tab === "rutina") renderRutina(main);
  else if (tab === "chat") renderChat(main);
  else if (tab === "analizar") renderAnalizar(main);
}

async function callGroq(system, messages, maxTokens) {
  if (!apiKey) throw new Error("NO_KEY");
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      max_tokens: maxTokens || 1500,
      messages: [{ role: "system", content: system }, ...messages.map(m => ({ role: m.role, content: m.content }))]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

// ── DIAGNÓSTICO ──
function renderDiagnostico(el) {
  if (diagPhase === "landing") {
    el.innerHTML = `
      <div style="max-width:560px;margin:0 auto;padding:28px 0;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;">
        <div class="hero-badge">⚡ Entrenador IA · Rocket League</div>
        <h1 class="hero-title">
          <span style="display:block;color:#fff">Sube de</span>
          <span style="display:block;background:linear-gradient(135deg,#0af,#0055ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Rango</span>
          <span style="display:block;font-size:55%;background:linear-gradient(135deg,#ff5500,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent">con RLCoach</span>
        </h1>
        <p style="color:rgba(255,255,255,0.32);font-size:0.85rem;letter-spacing:1px">Diagnóstico personalizado · Rutina semanal · IA entrenada en RL</p>
        <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center">
          ${RANKS.map(r => `<span class="rank-badge" style="color:${RANK_COLORS[r]};border-color:${RANK_COLORS[r]}44;background:${RANK_COLORS[r]}11">${r}</span>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%">
          <div class="step-card"><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;color:#0af;letter-spacing:2px;margin-bottom:6px;font-weight:700">PASO 01</div><div style="font-size:1.4rem;margin-bottom:6px">🔍</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;color:#fff">Diagnóstico</div><div style="font-size:0.7rem;color:rgba(255,255,255,0.3);margin-top:3px">6 preguntas clave</div></div>
          <div class="step-card"><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;color:#ff5500;letter-spacing:2px;margin-bottom:6px;font-weight:700">PASO 02</div><div style="font-size:1.4rem;margin-bottom:6px">🧠</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;color:#fff">Análisis IA</div><div style="font-size:0.7rem;color:rgba(255,255,255,0.3);margin-top:3px">Adaptado a tu rango</div></div>
          <div class="step-card"><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.58rem;color:#ffd700;letter-spacing:2px;margin-bottom:6px;font-weight:700">PASO 03</div><div style="font-size:1.4rem;margin-bottom:6px">📅</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:800;color:#fff">Rutina</div><div style="font-size:0.7rem;color:rgba(255,255,255,0.3);margin-top:3px">Plan semanal visual</div></div>
        </div>
        <button class="btn btn-orange" onclick="startDiag()">⚡ Iniciar Diagnóstico</button>
        <p style="font-size:0.68rem;color:rgba(255,255,255,0.18);letter-spacing:1px">~3 minutos · 6 preguntas · Rutina personalizada</p>
      </div>`;
  } else if (diagPhase === "done") {
    el.innerHTML = `
      <div style="max-width:500px;margin:60px auto;padding:0 20px;text-align:center">
        <div style="font-size:3rem;margin-bottom:14px">🎉</div>

      <div style="max-width:660px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 130px)">
        <div style="padding:10px 0 12px;border-bottom:1px solid rgba(0,170,255,0.08)">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;color:rgba(255,255,255,0.25);letter-spacing:2px;font-weight:700">DIAGNÓSTICO</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;color:#0af;letter-spacing:2px;font-weight:700" id="qCounter">${diagQNum} / 6</span>
          </div>
          <div class="pbar-bg"><div class="pbar-fill" id="qBar" style="width:${(diagQNum/6)*100}%;background:#0af"></div></div>
        </div>
        <div style="flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column" id="diagMsgs"></div>
        <div style="padding:10px 0 6px;border-top:1px solid rgba(0,170,255,0.08)">
          <div style="display:flex;gap:8px;align-items:flex-end">
            <textarea class="msg-input" id="diagInput" rows="2" placeholder="Escribe tu respuesta..." style="max-height:90px" onkeydown="diagKeyDown(event)"></textarea>
            <button class="btn btn-send" id="diagSendBtn" onclick="sendDiag()">Enviar</button>
          </div>
          <div style="margin-top:5px;font-size:0.62rem;color:rgba(255,255,255,0.14);text-align:center;letter-spacing:1px">ENTER para enviar</div>
        </div>
      </div>`;
    renderDiagMessages();
  }
}

function renderDiagMessages() {
  const el = document.getElementById("diagMsgs");
  if (!el) return;
  el.innerHTML = diagMessages.filter((m,i) => !(i===0)).map(m => {
    const u = m.role === "user";
    return `<div class="bubble ${u?"bubble-user":""}">${!u?`<div class="avatar">🚀</div>`:""}<div class="bubble-inner">${escHtml(m.content)}</div></div>`;
  }).join("") + (diagLoading ? `<div class="bubble"><div class="avatar">🚀</div><div class="bubble-inner"><div class="dots"><span></span><span></span><span></span></div></div></div>` : "");
  el.scrollTop = el.scrollHeight;
}

async function startDiag() {
  diagPhase = "chat";
  diagMessages = [];
  diagQNum = 0;
  renderDiagnostico(document.getElementById("mainContent"));
  diagLoading = true;
  renderDiagMessages();
  try {
    const reply = await callGroq(SYSTEM_COACH, [{ role: "user", content: "Empezar" }], 500);
    diagMessages = [{ role: "user", content: "Empezar" }, { role: "assistant", content: reply }];
    diagQNum = 1;
  } catch(e) {
    diagMessages = [{ role: "user", content: "Empezar" }, { role: "assistant", content: e.message === "NO_KEY" ? "Introduce tu API key de Groq arriba." : "Error al conectar. Inténtalo." }];
  }
  diagLoading = false;
  updateDiagProgress();
  renderDiagMessages();
}

function updateDiagProgress() {
  const c = document.getElementById("qCounter");
  const b = document.getElementById("qBar");
  if (c) c.textContent = diagQNum + " / 6";
  if (b) b.style.width = ((diagQNum/6)*100) + "%";
}

function diagKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendDiag(); }
}

async function sendDiag() {
  const input = document.getElementById("diagInput");
  if (!input || !input.value.trim() || diagLoading) return;
  const text = input.value.trim();
  input.value = "";
  diagMessages.push({ role: "user", content: text });
  diagQNum = Math.min(diagQNum + 1, 6);
  diagLoading = true;
  updateDiagProgress();
  renderDiagMessages();
  try {
    const reply = await callGroq(SYSTEM_COACH, diagMessages, 2000);
    const match = reply.trim().match(/\{[\s\S]*"tipo"\s*:\s*"rutina"[\s\S]*\}/);
    if (match) {
      try {
        const r = JSON.parse(match[0]);
        savedRoutine = r;
        localStorage.setItem("rlcoach-routine", JSON.stringify(r));
        updateRutinaLabel();
        diagPhase = "done";
        diagLoading = false;
        renderDiagnostico(document.getElementById("mainContent"));
        return;
      } catch(e2) {}
    }
    diagMessages.push({ role: "assistant", content: reply });
  } catch(e) {
    diagMessages.push({ role: "assistant", content: e.message === "NO_KEY" ? "Introduce tu API key arriba." : "Error. Inténtalo de nuevo." });
  }
  diagLoading = false;
  updateDiagProgress();
  renderDiagMessages();
}

function resetDiag() {
  diagPhase = "landing";
  diagMessages = [];
  diagQNum = 0;
  savedRoutine = null;
  localStorage.removeItem("rlcoach-routine");
  updateRutinaLabel();
  renderDiagnostico(document.getElementById("mainContent"));
}

function escHtml(t) {
  return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

let analyzeMedia = null, analyzeB64 = null, analyzeType = null, analyzeLoading = false, analyzeResult = null;

function renderAnalizar(el) {
  el.innerHTML = `
    <div style="max-width:600px;margin:0 auto">
      <div style="text-align:center;margin-bottom:22px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:5px">Analizar Mecánica</div>
        <p style="color:rgba(255,255,255,0.3);font-size:0.82rem">Sube una imagen o vídeo y la IA identifica la mecánica</p>
      </div>
      <label class="file-drop" for="fileInput">
        ${analyzeMedia ? (
          analyzeType === "image"
            ? `<img src="${analyzeMedia}" style="max-width:100%;max-height:260px;border-radius:8px;object-fit:contain">`
            : `<video src="${analyzeMedia}" controls style="max-width:100%;max-height:260px;border-radius:8px"></video>`
        ) : `
          <div style="font-size:2rem;margin-bottom:8px">📸</div>
          <p style="color:rgba(255,255,255,0.36);font-size:0.86rem">Toca para subir imagen o vídeo</p>
          <p style="color:rgba(255,255,255,0.18);font-size:0.72rem;margin-top:4px">JPG · PNG · MP4 · MOV</p>
        `}
      </label>
      <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleAnalyzeFile(event)"/>
      ${analyzeMedia ? `
      <div style="display:flex;gap:9px;margin-top:12px;justify-content:center">
        <button class="btn-ghost" onclick="clearAnalyze()">Cambiar</button>
        <button class="btn btn-blue" onclick="doAnalyze()" ${analyzeLoading?"disabled":""} style="padding:11px 26px">${analyzeLoading?"Analizando...":"Analizar"}</button>
      </div>` : ""}
      ${analyzeLoading ? `<div class="card" style="margin-top:16px;text-align:center;padding:22px"><div class="dots"><span></span><span></span><span></span></div><p style="color:rgba(255,255,255,0.28);font-size:0.8rem;margin-top:10px">Analizando...</p></div>` : ""}
      ${analyzeResult && !analyzeLoading ? `<div class="card" style="margin-top:16px;font-size:0.88rem;color:rgba(200,214,229,0.88);line-height:1.75;white-space:pre-wrap">${escHtml(analyzeResult)}</div>` : ""}
    </div>`;
}

function handleAnalyzeFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const isImg = f.type.startsWith("image/");
  const isVid = f.type.startsWith("video/");
  if (!isImg && !isVid) { alert("Solo imágenes y vídeos."); return; }
  analyzeResult = null;
  const reader = new FileReader();
  reader.onload = ev => {
    analyzeMedia = ev.target.result;
    analyzeType = isImg ? "image" : "video";
    analyzeB64 = ev.target.result.split(",")[1];
    renderAnalizar(document.getElementById("mainContent"));
  };
  reader.readAsDataURL(f);
}

function clearAnalyze() { analyzeMedia=null; analyzeB64=null; analyzeType=null; analyzeResult=null; renderAnalizar(document.getElementById("mainContent")); }

async function doAnalyze() {
  if (!analyzeB64 || analyzeLoading) return;
  if (!apiKey) { analyzeResult = "Introduce tu API key de Groq arriba."; renderAnalizar(document.getElementById("mainContent")); return; }
  analyzeLoading = true;
  renderAnalizar(document.getElementById("mainContent"));
  try {
    let b64 = analyzeB64;
    if (analyzeType === "video") {
      const video = document.createElement("video");
      video.src = analyzeMedia;
      await new Promise(r => { video.onloadeddata = r; video.load(); });
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext("2d").drawImage(video, 0, 0);
      b64 = canvas.toDataURL("image/jpeg").split(",")[1];
    }
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: JSON.stringify({
        model: "meta-llama/llama-4-scout-17b-16e-instruct",
        max_tokens: 1200,
        messages: [
          { role: "system", content: SYSTEM_MECANICA },
          { role: "user", content: [
            { type: "image_url", image_url: { url: "data:image/jpeg;base64," + b64 } },
            { type: "text", text: "Analiza esta imagen de Rocket League e identifica la mecánica, cómo ejecutarla y cómo mejorarla." }
          ]}
        ]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    analyzeResult = data.choices[0].message.content;
  } catch(e) {
    analyzeResult = "Error al analizar. Inténtalo de nuevo.";
  }
  analyzeLoading = false;
  renderAnalizar(document.getElementById("mainContent"));
}
